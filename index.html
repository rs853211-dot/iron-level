<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Iron Level</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Style: true-black-flat (seed 348780101). Face: rubber-floor near-black ground; the one data hue is the 15 kg plate yellow.
   Layout: one 480px phone column, 16px gutters, one 14px gap everywhere; elevation by lightness alone (ground → surface → raised); bottom bar of four destinations. */
:root{
  color-scheme: dark;
  --ground:#0d0d0c; --surface:#181817; --raised:#2a2a29; --active:#333331;
  --rule:#232322; --control:#444442;
  --text:#ffffff; --muted:#b4b4b4; --faint:#949494;
  --accent:#f2c230;            /* 15 kg plate yellow: data only, never chrome */
  --positive:#f2c230; --negative:#e5484d;
  --chart-off:#5a5a58; --chart-2:#d9d9d6;
  --body:#3a3a36; --muscle:#6a6a63; --head:#4d4d48;
  --pill-pos-bg:#2b2410; --pill-pos-ink:#f2c230;
  --pill-neg-bg:#2c1a1c; --pill-neg-ink:#ef6b6f;
  --pill-neu-bg:#262625; --pill-neu-ink:#ffffff;
  --on-primary:#0d0d0c;
  --radius-card:20px; --radius-inner:12px; --radius-control:999px;
  --gap:14px; --pad:18px;
  --font:"Inter",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  --fs-lead:34px; --fs-title:20px; --fs-section:16px; --fs-kpi:24px; --fs-body:14px; --fs-small:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ground);color:var(--text);font-family:var(--font);font-size:var(--fs-body);line-height:1.43;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--ground)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;touch-action:manipulation}
input{font:inherit;color:var(--text)}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(92px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-size:var(--fs-title);line-height:1.25}
h2{font-size:var(--fs-section);line-height:1.3}
h3{font-size:var(--fs-body);line-height:1.35}
p{margin:0}
.meta{font-size:var(--fs-small);color:var(--faint)}
.sub{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:var(--gap)}
.tight{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:var(--surface);border-radius:var(--radius-card);padding:var(--pad);display:flex;flex-direction:column;gap:12px;min-width:0}
.well{background:var(--raised);border-radius:var(--radius-inner);padding:12px 14px}

/* controls: one height on the phone, pills; primary by inversion */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:var(--radius-control);font-weight:600;font-size:15px;background:var(--raised);color:var(--text);transition:background-color .15s,transform .1s}
.btn:hover{background:var(--active)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--text);color:var(--on-primary)}
.btn.primary:hover{background:#e6e6e6}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--raised)}
.btn.danger{background:transparent;color:var(--negative);box-shadow:inset 0 0 0 1px var(--negative)}
.btn.small{min-height:36px;padding:0 14px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{color:var(--faint);background:var(--raised);cursor:default;transform:none}
.link{color:var(--text);font-weight:500;font-size:13px;min-height:36px;display:inline-flex;align-items:center}
.link:hover{text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;flex:none;white-space:nowrap;background:var(--pill-neu-bg);color:var(--pill-neu-ink)}
.pill.pos{background:var(--pill-pos-bg);color:var(--pill-pos-ink)}
.pill.neg{background:var(--pill-neg-bg);color:var(--pill-neg-ink)}
.seg{display:flex;background:var(--surface);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;height:36px;border-radius:999px;font-size:13px;font-weight:500;color:var(--faint);transition:color .15s,background-color .15s}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--text)}
.track{height:8px;border-radius:99px;background:var(--raised);overflow:hidden}
.track > i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.track.grey > i{background:var(--chart-2)}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field label{font-size:13px;font-weight:500;color:var(--muted)}
.field input{height:48px;border-radius:var(--radius-inner);border:1px solid var(--control);background:var(--surface);padding:0 14px;font-size:16px;width:100%;min-width:0}
.field input::placeholder{color:var(--faint)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.notice{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--pill-pos-bg);color:var(--pill-pos-ink);border-radius:var(--radius-inner);padding:10px 12px 10px 14px;font-size:13px}

/* title row */
.titlerow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:8px;min-height:48px}
.titlerow h1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* KPI strip: one container split by dividers */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:var(--surface);border-radius:var(--radius-card)}
.kpis > div{padding:14px var(--pad);min-width:0}
.kpis > div:nth-child(odd){box-shadow:inset -1px 0 0 var(--rule)} /* taste-skill-ignore: 1px divider, not a shadow */
.kpis > div:nth-child(n+3){box-shadow:inset 0 1px 0 var(--rule)}
.kpis > div:nth-child(3){box-shadow:inset 0 1px 0 var(--rule),inset -1px 0 0 var(--rule)}
.kpis.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis.three > div{box-shadow:none}
.kpis.three > div + div{box-shadow:inset 1px 0 0 var(--rule)}
.kpi-l{font-size:var(--fs-small);color:var(--muted)}
.kpi-v{font-size:var(--fs-kpi);font-weight:400;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:2px}
.kpi-v small{font-size:13px;color:var(--faint);margin-left:3px}

/* lead: level */
.lead{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:end}
.lead-v{font-size:var(--fs-lead);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}

/* character */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap);align-items:center}
.hero svg{width:100%;height:auto;max-height:320px;display:block}
.m{transition:fill .25s}
.m.worked{fill:var(--accent)}
.m.lag{stroke:var(--text);stroke-width:1.6;stroke-dasharray:4 3}
.key{display:flex;gap:14px;flex-wrap:wrap;font-size:var(--fs-small);color:var(--muted)}
.key i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:-1px}
.groups-list{display:flex;flex-direction:column;gap:9px}
.g-row{display:grid;grid-template-columns:62px minmax(0,1fr) 26px;gap:8px;align-items:center;font-size:13px}
.g-row .track{height:6px}
.g-row span:last-child{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

/* lists */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 0;min-width:0}
.li + .li{box-shadow:inset 0 1px 0 var(--rule)}
.li .t{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:var(--fs-small);color:var(--faint);display:block}
.li .fig{text-align:right;font-variant-numeric:tabular-nums;flex:none}
button.li{width:100%;text-align:left;border-radius:0;transition:background-color .15s}
button.li:hover{background:var(--raised)}

/* workout */
.sets{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr) 44px;gap:8px;align-items:center}
.sets .h{font-size:var(--fs-small);color:var(--faint)}
.sets input{height:48px;border-radius:var(--radius-inner);border:1px solid var(--control);background:var(--ground);text-align:center;font-size:18px;font-variant-numeric:tabular-nums;width:100%;min-width:0}
.sets input:focus{border-color:var(--text);outline:none}
.sets .n{font-size:13px;color:var(--faint);text-align:center;font-variant-numeric:tabular-nums}
.sets .n.pr{color:var(--accent);font-weight:600}
.sets .x{height:44px;width:44px;border-radius:999px;color:var(--faint);font-size:20px}
.sets .x:hover{background:var(--raised);color:var(--text)}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:flex;align-items:flex-end;justify-content:center;overscroll-behavior:contain}
.sheet{width:100%;max-width:480px;max-height:86vh;overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:24px 24px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet > *{flex:none}
.search{height:44px;border-radius:999px;border:1px solid var(--control);background:var(--ground);padding:0 16px;width:100%;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;overscroll-behavior-x:contain}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:500;color:var(--faint);background:var(--raised)}
.chips button[aria-pressed="true"]{background:var(--text);color:var(--on-primary)}

/* bottom bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ground);box-shadow:inset 0 1px 0 var(--rule);padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;justify-content:center;font-size:11px;font-weight:500;color:var(--faint);transition:color .15s}
.tab svg{width:22px;height:22px}
.tab:hover,.tab[aria-current="page"]{color:var(--text)}
.tab .live{width:7px;height:7px;border-radius:50%;background:var(--accent);position:absolute;top:7px;left:calc(50% + 9px)}

/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--faint);font-size:11px;font-family:var(--font);font-variant-numeric:tabular-nums}

.big-xp{font-size:var(--fs-lead);font-weight:600;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--text);color:var(--on-primary);padding:10px 18px;border-radius:999px;font-weight:500;font-size:14px;max-width:calc(100% - 32px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

<div class="app" id="app"><div class="stack" style="padding-top:32px"><h1>Iron Level</h1><p class="sub">Загружаю персонажа…</p></div></div>

<script>
(function(){
"use strict";
/* ---------- reference data ---------- */
const GROUPS = {chest:"Грудь",back:"Спина",legs:"Ноги",shoulders:"Плечи",arms:"Руки",core:"Пресс"};
const GROUP_KEYS = Object.keys(GROUPS);
// t = e1RM ÷ bodyweight that counts as 100 (solid advanced level). bw: bodyweight lift (bodyweight + added). per: weight is per dumbbell
// z: zone in the gym. hint: what to enter as weight. Old ids stay so saved workouts keep reading.
const ZONES = {hs:"Hammer Strength · рычажные",lf:"Life Fitness · блочные",cable:"Кроссовер и блоки",free:"Свободные веса",bw:"Свой вес и станции",custom:"Мои тренажёры"};
const ZONE_ORDER = ["hs","lf","cable","free","bw","custom"];
const EX = [
 // Hammer Strength plate-loaded
 {id:"hs-bench",n:"Iso-Lateral Bench Press",ru:"жим от груди",g:"chest",t:1.4,z:"hs",plates:true},
 {id:"hs-incl",n:"Iso-Lateral Incline Press",ru:"жим на наклонной",g:"chest",t:1.2,z:"hs",plates:true},
 {id:"hs-decl",n:"Iso-Lateral Decline Press",ru:"жим под отрицательным углом",g:"chest",t:1.5,z:"hs",plates:true},
 {id:"hs-shp",n:"Iso-Lateral Shoulder Press",ru:"жим над головой",g:"shoulders",t:1,z:"hs",plates:true},

 {id:"hs-hrow",n:"Iso-Lateral High Row",ru:"тяга сверху к груди",g:"back",t:1.3,z:"hs",plates:true},
 {id:"hs-lrow",n:"Iso-Lateral Low Row",ru:"тяга к поясу",g:"back",t:1.3,z:"hs",plates:true},

 {id:"hs-ab",n:"Abdominal/Oblique Crunch",ru:"скручивания",g:"core",t:1,z:"hs",plates:true},
 // Life Fitness Insignia selectorized

 {id:"lf-row",n:"Seated Row",ru:"тяга сидя",g:"back",t:1.1,z:"lf"},

 {id:"lf-legp",n:"Leg Press",ru:"жим ногами",g:"legs",t:3,z:"lf"},
 {id:"lf-ext",n:"Leg Extension",ru:"разгибание ног",g:"legs",t:1.2,z:"lf"},
 {id:"lf-scurl",n:"Seated Leg Curl",ru:"сгибание ног сидя",g:"legs",t:.9,z:"lf"},

 // cables
 {id:"fly",n:"Сведение в кроссовере",g:"chest",t:.35,z:"cable"},
 {id:"lat",n:"Тяга верхнего блока",g:"back",t:1.2,z:"cable"},
 {id:"cab-row",n:"Тяга нижнего блока",g:"back",t:1,z:"cable"},
 {id:"cab-face",n:"Тяга каната к лицу",g:"shoulders",t:.35,z:"cable"},
 {id:"pushd",n:"Разгибания на блоке",g:"arms",t:.75,z:"cable"},

 {id:"cable-cr",n:"Скручивания на блоке",g:"core",t:.7,z:"cable"},
 // free weights
 {id:"bench",n:"Жим лёжа",g:"chest",t:1.5,z:"free"},
 {id:"incbb",n:"Жим штанги на наклонной",g:"chest",t:1.25,z:"free"},

 {id:"lat-r",n:"Махи гантелями в стороны",g:"shoulders",t:.17,per:true,z:"free"},
 {id:"curl",n:"Подъём штанги на бицепс",g:"arms",t:.75,z:"free"},

 {id:"plank-w",n:"Планка с весом",g:"core",t:.5,z:"free"},
 // bodyweight and stations
 {id:"pull",n:"Подтягивания",g:"back",t:1.7,bw:true,z:"bw"},
 {id:"dips",n:"Отжимания на брусьях",g:"chest",t:1.9,bw:true,z:"bw"},
 {id:"hyper",n:"Гиперэкстензия",g:"back",t:1.4,bw:true,z:"bw"},
 {id:"hang",n:"Подъём ног в висе",g:"core",t:2.2,bw:true,z:"bw"}
];
const CUSTOM_T = {chest:1.1,back:1.1,legs:2.5,shoulders:.8,arms:.55,core:.8};
let EXM = {}, ALL = [];
function rebuildEx(){
  const custom = ((S.profile&&S.profile.custom)||[]).map(c=>Object.assign({t:CUSTOM_T[c.g]||1,z:"custom"},c));
  ALL = EX.concat(custom); EXM = Object.fromEntries(ALL.map(e=>[e.id,e]));
}
const isHidden = id => !!(S.profile&&S.profile.hidden&&S.profile.hidden.includes(id));
const exTitle = e => e.ru ? `${e.n} · ${e.ru}` : e.n;
const exHint = e => e.bw?"вес тела плюс доп. вес":e.per?"вес одной гантели":e.plates?"блины на обе стороны, кг":e.z==="lf"||e.z==="cable"?"вес на стеке":"";
const XP = {set:5, pr:25, done:30, quest:15, week3:.10};
const levelNeed = L => 100 + 50*(L-1);
const rankOf = L => L>=15?"Легенда":L>=10?"Силач":L>=6?"Атлет":L>=3?"Любитель":"Новичок";

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NF = {};
const fmt = (n,d=0) => (NF[d]||(NF[d]=new Intl.NumberFormat("ru-RU",{minimumFractionDigits:d,maximumFractionDigits:d}))).format(n);
const fmtW = n => new Intl.NumberFormat("ru-RU",{maximumFractionDigits:1}).format(n);
const sign = (n,d) => (n>0?"+":n<0?"−":"")+fmt(Math.abs(n),d);
const e1rm = (w,r) => r<=0?0: r===1? w : w*(1+r/30);
const today = () => dkey(new Date());
function dkey(d){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function parseD(k){const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)}
function weekKey(k){const d=parseD(k);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return dkey(d)}
function addDays(k,n){const d=parseD(k);d.setDate(d.getDate()+n);return dkey(d)}
const DF = new Intl.DateTimeFormat("ru-RU",{day:"numeric",month:"short"});
const niceDate = k => DF.format(parseD(k)).replace(".","");
const relDate = k => {const t=today(); if(k===t) return "Сегодня"; if(k===addDays(t,-1)) return "Вчера"; return niceDate(k)};
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function plural(n,a,b,c){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return c;if(n1>1&&n1<5)return b;if(n1===1)return a;return c}
function loadW(ex,s,bw){const e=EXM[ex];return e&&e.bw?(bw+(+s.w||0)):(+s.w||0)}

/* ---------- storage: private db subtree, falls back to this browser ---------- */
const LS="ironlevel.v1";
const store = {
  mode:"local", db:null, uid:null,
  async init(){
    try{
      if(window.claude && typeof window.claude.use==="function"){
        const [db,user] = await Promise.all([window.claude.use("db"),window.claude.use("user")]);
        const id = user ? await user.id() : null;
        if(db && id){this.db=db;this.uid=id;this.mode="db"}
      }
    }catch(e){}
  },
  profRef(){return this.db.doc("data/users/"+this.uid+"/profile")},
  wCol(){return this.profRef().collection("workouts")},
  async load(){
    if(this.mode==="db"){
      try{
        const p = await this.profRef().get();
        const ws = await this.wCol().get();
        return {profile:p.exists?p.data().profile:null, workouts:ws.docs.map(d=>d.data())};
      }catch(e){ this.mode="local"; }
    }
    try{const raw=localStorage.getItem(LS);if(raw)return JSON.parse(raw)}catch(e){}
    return {profile:null,workouts:[]};
  },
  local(){try{localStorage.setItem(LS,JSON.stringify({profile:S.profile,workouts:S.workouts}))}catch(e){}},
  async saveProfile(p){
    if(this.mode==="db"){try{await this.profRef().set({profile:p});return}catch(e){toast("Профиль не сохранился. Проверь сеть и сохрани ещё раз")}}
    this.local();
  },
  async saveWorkout(w){
    if(this.mode==="db"){try{await this.wCol().doc(w.id).set(w);return}catch(e){toast(e&&e.code==="quota_exceeded"?"Хранилище заполнено: удали старые тренировки":"Тренировка не сохранилась. Проверь сеть")}}
    this.local();
  },
  async delWorkout(id){
    if(this.mode==="db"){try{await this.wCol().doc(id).delete();return}catch(e){toast("Не удалось удалить. Попробуй ещё раз")}}
    this.local();
  },
  /* import: unlike local(), a failed write is reported, so the user knows the backup did not land */
  async replaceAll(profile,workouts){
    if(this.mode==="db"){
      try{
        await this.profRef().set({profile});
        const keep=new Set(workouts.map(w=>w.id)), old=await this.wCol().get();
        for(const d of old.docs){const id=d.data().id; if(!keep.has(id)) await this.wCol().doc(id).delete()}
        for(const w of workouts) await this.wCol().doc(w.id).set(w);
        return true;
      }catch(e){toast("Не получилось загрузить в хранилище. Проверь сеть");return false}
    }
    try{localStorage.setItem(LS,JSON.stringify({profile,workouts}));return true}
    catch(e){toast("В браузере не хватило места для этих данных");return false}
  }
};

/* ---------- backup: profile + log as one JSON file; everything derived is recomputed on load ---------- */
const BACKUP_V=1;
function makeBackup(profile,workouts,demo){
  return {app:"iron-level",version:BACKUP_V,exportedAt:new Date().toISOString(),profile,workouts:demo?[]:workouts};
}
function parseBackup(text){
  const fail=error=>({ok:false,error});
  const isObj=v=>!!v&&typeof v==="object"&&!Array.isArray(v);
  const str=v=>typeof v==="string";
  let o; try{o=JSON.parse(text)}catch(e){return fail("Не получилось прочитать файл. Это точно JSON из Iron Level?")}
  if(!isObj(o)||("app" in o&&o.app!=="iron-level")) return fail("Это файл не из Iron Level");
  if(+o.version>BACKUP_V) return fail("Файл из более новой версии Iron Level. Обнови страницу и попробуй снова");
  const p=o.profile;
  if(!isObj(p)||!str(p.name)||!p.name.trim()||typeof p.bw!=="number"||!(p.bw>25&&p.bw<300)) return fail("В файле нет профиля персонажа");
  if(!Array.isArray(o.workouts)) return fail("В файле нет журнала тренировок");
  const profile=Object.assign({},p,{
    sex:p.sex==="f"?"f":"m",
    hidden:Array.isArray(p.hidden)?p.hidden.filter(str):[],
    custom:Array.isArray(p.custom)?p.custom.filter(c=>isObj(c)&&str(c.id)&&str(c.n)&&str(c.g)):[]
  });
  const seen=new Set(), workouts=[]; let skipped=0;
  for(const w of o.workouts){
    if(!isObj(w)||!str(w.id)||seen.has(w.id)||!str(w.date)||!/^\d{4}-\d{2}-\d{2}$/.test(w.date)||!Array.isArray(w.exercises)){skipped++;continue}
    seen.add(w.id);
    const exercises=w.exercises.filter(e=>isObj(e)&&str(e.ex)&&Array.isArray(e.sets))
      .map(e=>({ex:e.ex,sets:e.sets.filter(isObj).map(s=>({w:String(s.w??"0"),r:String(s.r??"0")}))}));
    const out={id:w.id,date:w.date}; if(typeof w.t==="number") out.t=w.t; out.exercises=exercises;
    workouts.push(out);
  }
  return {ok:true,profile,workouts,skipped};
}
/* iPhone: share sheet ("Save to Files"); elsewhere: a plain download */
async function downloadBackup(){
  const name="iron-level-"+today()+".json";
  const json=JSON.stringify(makeBackup(S.profile,S.workouts,S.demo),null,2);
  const file=new File([json],name,{type:"application/json"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return}
    catch(e){if(e&&e.name==="AbortError")return}
  }
  const url=URL.createObjectURL(file), a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),0);
  toast("Файл сохранён: "+name);
}

/* ---------- derived numbers: all XP is recomputed from the log, so it never drifts ---------- */
function derive(){
  const bw = (S.profile&&+S.profile.bw)||75;
  const ws = [...S.workouts].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.t||0)-(b.t||0));
  const best = {}, bestW = {}, weekCount = {}, weekGroups = {};
  let xp=0, prs=0, volume=0, level=1, into=0, maxStreak=0;
  const unlocked = {}; const perW = {}; let cum=null;
  for(const w of ws){
    const wk = weekKey(w.date);
    weekCount[wk]=(weekCount[wk]||0)+1;
    const lagG = lagging(groupStrength(best,bw));
    let gained = XP.done, wPR=[], setsBy={}, vol=0, prSets=0, nSets=0;
    for(const ex of w.exercises||[]){
      const e=EXM[ex.ex]; if(!e) continue;
      for(const s of ex.sets||[]){
        const r=+s.r||0; if(r<=0) continue;
        const v = e1rm(loadW(ex.ex,s,bw),r);
        gained += XP.set; nSets++;
        vol += (e.per?2:1)*(+s.w||0)*r + (e.bw?bw*r:0);
        setsBy[e.g]=(setsBy[e.g]||0)+1;
        if(best[ex.ex]!=null && v>best[ex.ex]+0.01){gained+=XP.pr;prs++;prSets++;if(!wPR.includes(ex.ex))wPR.push(ex.ex)}
        if(best[ex.ex]==null||v>best[ex.ex]) best[ex.ex]=v;
        bestW[ex.ex]=Math.max(bestW[ex.ex]||0,+s.w||0);
      }
    }
    const questDone = !!lagG && (setsBy[lagG]||0)>=3;
    if(questDone) gained += XP.quest;
    const base = gained;
    if(weekCount[wk]>=3) gained = Math.round(gained*(1+XP.week3));
    weekGroups[wk] = Object.assign(weekGroups[wk]||{}, setsBy);
    xp += gained; volume += vol;
    level=1; let rest=xp; while(rest>=levelNeed(level)){rest-=levelNeed(level);level++} into=rest;
    const st=streakAt(weekCount,wk); maxStreak=Math.max(maxStreak,st);
    cum = {workouts:Object.keys(perW).length+1, prs, volume, level, bestW:{...bestW}, streak:maxStreak, weekGroups:weekGroups[wk], bw};
    const newAch=[];
    for(const a of ACH){ if(!unlocked[a.id] && a.test(cum)){unlocked[a.id]=w.date;newAch.push(a.id)} }
    perW[w.id] = {xp:gained, base, bonus:gained-base, prs:wPR, prSets, nSets, vol, questDone, lagG, newAch, setsBy, levelAfter:level};
  }
  if(!cum) cum={workouts:0,prs:0,volume:0,level:1,bestW:{},streak:0,weekGroups:{},bw};
  const g = groupStrength(best,bw);
  const lag = lagging(g);
  const now = today(); const cw = weekKey(now);
  const curStreak = streakAt(weekCount, (weekCount[cw]||0)>=2 ? cw : addDays(cw,-7));
  const last30 = ws.filter(w=>w.date>addDays(now,-30));
  const load30 = {}; let sets30=0;
  for(const w of last30) for(const ex of w.exercises||[]){const e=EXM[ex.ex];if(!e)continue;const n=(ex.sets||[]).filter(s=>+s.r>0).length;load30[e.g]=(load30[e.g]||0)+n;sets30+=n}
  const vol30 = last30.reduce((a,w)=>a+(perW[w.id]?perW[w.id].vol:0),0);
  const avgStr = GROUP_KEYS.reduce((a,k)=>a+g[k],0)/GROUP_KEYS.length;
  const workedToday = new Set(); for(const w of ws.filter(w=>w.date===now)) for(const ex of w.exercises||[]) if(EXM[ex.ex]) workedToday.add(EXM[ex.ex].g);
  const thisWeek = weekCount[cw]||0;
  return {ws, best, bestW, g, lag, xp, level, into, need:levelNeed(level), prs, volume, curStreak, weekCount, thisWeek, load30, sets30, vol30, last30, avgStr, workedToday, unlocked, perW, bw, cum};
}
function groupStrength(best,bw){
  const g={}; for(const k of GROUP_KEYS) g[k]=0;
  for(const id in best){const e=EXM[id];if(!e)continue;g[e.g]=Math.max(g[e.g],Math.min(1,best[id]/(bw*e.t)))}
  return g;
}
function lagging(g){let m=null;for(const k of GROUP_KEYS){if(m==null||g[k]<g[m])m=k}return m}
function streakAt(wc,wk){let n=0,k=wk;while((wc[k]||0)>=2){n++;k=addDays(k,-7)}return n}

function lastSetsFor(exId){
  for(let i=D.ws.length-1;i>=0;i--){const w=D.ws[i];const ex=(w.exercises||[]).find(e=>e.ex===exId);if(ex&&ex.sets&&ex.sets.length)return {date:w.date,sets:ex.sets}}
  return null;
}
function topSet(sets){return sets.reduce((a,s)=>(+s.w>+a.w?s:a),sets[0])}
function cap(s){return s[0].toUpperCase()+s.slice(1)}
function suggestion(exId){
  const last=lastSetsFor(exId); if(!last) return null;
  const sets=last.sets.filter(s=>+s.r>0); if(!sets.length) return null;
  const top=topSet(sets); const allHit = sets.every(s=>+s.r>=8);
  const e=EXM[exId]; const step = e.per||e.g==="arms"||(e.g==="shoulders"&&!e.plates)?1:(e.plates||e.z==="lf")?5:2.5;
  const when=cap(relDate(last.date));
  if(allHit) return `${when}: ${fmtW(+top.w)} кг × ${top.r}. Все подходы на 8+ повторов, попробуй ${fmtW(+top.w+step)} кг × 6–8.`;
  return `${when}: ${fmtW(+top.w)} кг × ${top.r}. Останься на ${fmtW(+top.w)} кг и добери до 8 повторов в каждом подходе.`;
}

function exCard(ex,i){
  const e=EXM[ex.ex]; const sug=suggestion(ex.ex); const prev=D.best[ex.ex];
  return `<div class="card">
    <div class="row between" style="align-items:flex-start"><div class="grow"><h2>${esc(e.n)}</h2><p class="meta">${e.ru?esc(e.ru)+" · ":""}${GROUPS[e.g]}${exHint(e)?" · "+exHint(e):""}</p></div>
      <button class="link" data-act="rm-ex" data-i="${i}" style="color:var(--faint)">Убрать</button></div>
    ${sug?`<div class="well sub" style="font-size:13px">${esc(sug)}</div>`:""}

      ${ex.sets.map((s,j)=>{const isPR=prev!=null&&+s.r>0&&e1rm(loadW(ex.ex,s,D.bw),+s.r)>prev+0.01;
        return `<span class="n${isPR?" pr":""}" id="n-${i}-${j}">${isPR?"PR":j+1}</span>

    </div>
    <button class="btn small" data-act="add-set" data-i="${i}" style="align-self:flex-start">Ещё подход</button>
  </div>`;
}

function achRow(a,date){
  const [h,n]=a.p(D.cum); const on=!!date; const ratio=on?1:Math.max(0,Math.min(1,h/n));
  const fmtH = a.u==="т"?fmt(Math.min(h,n),1):fmtW(Math.min(h,n));
  return `<div class="li" style="flex-wrap:wrap;gap:6px 12px">
    <span class="grow"><span class="t" style="color:${on?"var(--text)":"var(--muted)"}">${esc(a.t)}</span></span>
    <span class="fig meta num">${on?"Получено: "+relDate(date).toLowerCase():`${fmtH} из ${fmtW(n)}${a.u?" "+a.u:""}`}</span>
    <div class="track ${on?"":"grey"}" style="flex-basis:100%;height:4px"><i style="width:${Math.round(ratio*100)}%"></i></div>
  </div>`;
}
function histRow(w,canDelete=true){
  const r=D.perW[w.id]||{xp:0,vol:0,prSets:0}; const gs=[...new Set((w.exercises||[]).map(e=>EXM[e.ex]&&EXM[e.ex].g).filter(Boolean))].map(g=>GROUPS[g]);
  const confirm = S.confirm==="del:"+w.id;
  return `<div class="li">
    <span class="grow"><span class="t">${gs.join(", ")||"Тренировка"}</span><span class="s num">${relDate(w.date)} · ${fmt(r.vol/1000,2)} т${r.prSets?` · <span style="color:var(--accent)">${r.prSets} PR</span>`:""}</span></span>
    <span class="fig num">+${fmt(r.xp)} XP</span>
    ${S.demo||!canDelete?"":`<button class="btn small ${confirm?"danger":"ghost"}" data-act="${confirm?"del-yes":"del"}" data-id="${w.id}" aria-label="${confirm?"Подтвердить удаление":"Удалить тренировку"} ${niceDate(w.date)}">${confirm?"Удалить":"×"}</button>`}
  </div>`;
}

function viewProgress(){
  const d=D; const now=today();
  const days = S.period==="4w"?28:S.period==="3m"?91:100000;
  const from = addDays(now,-days);
  const ws = d.ws.filter(w=>w.date>from);
  const vol = ws.reduce((a,w)=>a+(d.perW[w.id]?d.perW[w.id].vol:0),0);
  const prsP = ws.reduce((a,w)=>a+(d.perW[w.id]?d.perW[w.id].prSets:0),0);
  const nW = S.period==="4w"?6:S.period==="3m"?13:Math.min(26,Math.max(6,Object.keys(d.weekCount).length+1));
  const cw=weekKey(now); const weeks=[]; for(let i=nW-1;i>=0;i--) weeks.push(addDays(cw,-7*i));
  const wv = weeks.map(k=>d.ws.filter(w=>weekKey(w.date)===k).reduce((a,w)=>a+(d.perW[w.id]?d.perW[w.id].vol:0),0)/1000);
  const load={}; let tot=0; for(const w of ws) for(const ex of w.exercises||[]){const e=EXM[ex.ex];if(!e)continue;const n=ex.sets.filter(s=>+s.r>0).length;load[e.g]=(load[e.g]||0)+n;tot+=n}
  const rows=[];
  for(const e of ALL){
    let before=0, inP=0;
    for(const w of d.ws) for(const ex of w.exercises||[]) if(ex.ex===e.id) for(const s of ex.sets) if(+s.r>0){const v=e1rm(loadW(e.id,s,d.bw),+s.r); if(w.date<=from) before=Math.max(before,v); else inP=Math.max(inP,v)}
    if(inP) rows.push({e,inP,delta:before?Math.round((inP-before)*10)/10:null});
  }
  rows.sort((a,b)=>(b.delta??-1e9)-(a.delta??-1e9));
  const prevWeek = wv[wv.length-2]||0, curWeek=wv[wv.length-1]||0;
  const lowG = GROUP_KEYS.reduce((m,k)=>(load[k]||0)<(load[m]||0)?k:m,GROUP_KEYS[0]);
  return `<div class="stack">
    <div class="titlerow"><div class="grow"><h1>Прогресс</h1><p class="sub" style="font-size:13px">${rows.length&&rows[0].delta!=null?`Быстрее всего растёт ${esc(rows[0].e.n.toLowerCase())}: ${sign(rows[0].delta,1)} кг к расчётному максимуму за период.`:rows.length?"Первые записи есть. Сравнение появится, когда пройдёт период.":"Здесь появятся твои веса и объём."}</p></div></div>
    <div class="seg" role="group" aria-label="Период">${[["4w","4 недели"],["3m","3 месяца"],["all","Всё время"]].map(([k,n])=>`<button data-period="${k}" aria-pressed="${S.period===k}">${n}</button>`).join("")}</div>
    <div class="kpis three">
      <div><div class="kpi-l">Тренировок</div><div class="kpi-v">${ws.length}</div></div>
      <div><div class="kpi-l">Объём</div><div class="kpi-v">${fmt(vol/1000,1)}<small>т</small></div></div>
      <div><div class="kpi-l">Рекордов</div><div class="kpi-v">${prsP}</div></div>
    </div>
    <div class="card chart"><div class="tight" style="gap:2px"><h2>Объём по неделям, т</h2><span class="meta num">Эта неделя ${fmt(curWeek,1)} т, прошлая ${fmt(prevWeek,1)} т</span></div>${barChart(weeks,wv)}</div>
    <div class="card"><div class="row between"><h2>Подходы по группам</h2><span class="meta num">${tot} за период</span></div>
      <div class="groups-list">
      ${GROUP_KEYS.map(g=>{const n=load[g]||0;const p=tot?Math.round(100*n/tot):0;return `<div class="g-row" style="grid-template-columns:62px minmax(0,1fr) 64px"><span>${GROUPS[g]}</span><div class="track grey"><i style="width:${p}%"></i></div><span>${n} · ${p}%</span></div>`}).join("")}
      </div>
      ${tot?`<p class="meta">Меньше всего подходов: ${GROUPS[lowG].toLowerCase()}.</p>`:""}
    </div>
    <div class="card"><div class="row between"><h2>Упражнения</h2><span class="meta">к началу периода</span></div>
      ${rows.length?`<div class="list">${rows.map(r=>`<div class="li"><span class="grow"><span class="t">${esc(r.e.n)}</span><span class="s num">Расчётный максимум ${fmtW(r.inP)} кг</span></span>
        ${r.delta==null?'<span class="pill">новое</span>':`<span class="pill ${r.delta>0?"pos":r.delta<0?"neg":""} num">${r.delta===0?"0 кг":sign(r.delta,1)+" кг"}</span>`}</div>`).join("")}</div>`:'<p class="sub">За этот период упражнений нет.</p>'}
    </div>
    <div class="card"><div class="row between"><h2>История</h2><span class="meta num">${d.ws.length} ${plural(d.ws.length,"тренировка","тренировки","тренировок")}</span></div>${d.ws.length?`<div class="list">${[...d.ws].reverse().slice(0,30).map(w=>histRow(w)).join("")}</div>`:'<p class="sub">Пока пусто. Первая тренировка появится здесь.</p>'}</div>
  </div>`;
}
function barChart(weeks,vals){
  const W=320,H=150,pl=28,pb=22,pt=8; const max=Math.max(...vals,0.1);
  const step=max>40?20:max>20?10:max>8?4:max>4?2:1; let nice=Math.ceil(max/step)*step; if(nice<=max) nice+=step;
  const bw=(W-pl)/vals.length; const ticks=[0,nice/2,nice];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Объём по неделям, тонны">
    ${ticks.map((t,i)=>{const y=pt+(H-pt-pb)*(1-t/nice);return `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="${i?"var(--rule)":"var(--control)"}" stroke-width="1"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${fmt(t,t%1?1:0)}</text>`}).join("")}
    ${vals.map((v,i)=>{const h=(H-pt-pb)*(v/nice);const x=pl+i*bw+bw*.2;const last=i===vals.length-1;
      return `<rect x="${x}" y="${H-pb-h}" width="${bw*.6}" height="${h}" fill="var(--${last?"accent":"chart-off"})"><title>${niceDate(weeks[i])}: ${fmt(v,1)} т</title></rect>
      ${(vals.length<=7||i%2===(vals.length-1)%2)?`<text x="${x+bw*.3}" y="${H-6}" text-anchor="middle" ${last?'style="fill:var(--text)"':""}>${last?"эта":niceDate(weeks[i])}</text>`:""}`}).join("")}
  </svg>`;
}

/* ---------- demo data (in memory only) ---------- */
function makeDemo(){
  const out=[]; const now=today(); const start=addDays(weekKey(now),-7*8);
  const plan=[["hs-bench","incdb","lf-shp","pushd"],["dead","pull","hs-hrow","curl"],["squat","lf-scurl","hs-legp","hang"]];
  const base={"hs-bench":70,incdb:20,"lf-shp":35,pushd:25,dead:100,pull:0,"hs-hrow":60,curl:25,squat:80,"lf-scurl":35,"hs-legp":140,hang:0};
  for(let wk=0;wk<8;wk++) for(let dd=0;dd<3;dd++){
    if(wk===5&&dd===2) continue;
    const date=addDays(start,wk*7+dd*2); if(date>now) continue;
    const exs=plan[dd].map(id=>{
      const slow=EXM[id].per||id==="pull"||id==="hang";
      const b=base[id]+(slow?Math.floor(wk/3)*2:wk*2.5*(id==="dead"||id==="hs-legp"?2:1)/(id==="pushd"||id==="curl"||id==="lf-scurl"||id==="lf-shp"?2:1));
      return {ex:id,sets:[0,1,2].map(i=>({w:String(Math.round(b*2)/2),r:String(id==="pull"?8-i+Math.floor(wk/3):id==="hang"?12-i:8-(i===2?1:0)+(wk%3===2?1:0))}))}});
    out.push({id:"demo"+wk+dd,date,t:wk*10+dd,exercises:exs});
  }
  return out;
}

/* ---------- AI coach ---------- */
let coachCtl=null;
async function askCoach(){
  let sample=null; try{sample=window.claude?await window.claude.use("sample"):null}catch(e){}
  if(!sample){S.coach={state:"error",msg:"ИИ-тренер работает, когда страница открыта в Claude.",retry:false};render();return}
  S.coach={state:"loading"};render();
  const d=D; const recent=d.ws.slice(-10).map(w=>`${w.date}: `+(w.exercises||[]).map(e=>`${EXM[e.ex]?EXM[e.ex].n:e.ex} ${e.sets.filter(s=>+s.r>0).map(s=>`${s.w}×${s.r}`).join(", ")}`).join("; ")).join("\n");
  const prompt=`Ты персональный тренер в фитнес-приложении. Ответь на русском, коротко и конкретно, обращайся на «ты».
Атлет: пол ${S.profile.sex==="f"?"женский":"мужской"}, вес ${S.profile.bw} кг, рост ${S.profile.height||"?"} см, возраст ${S.profile.age||"?"}.
Сила групп мышц (0-100, относительно веса тела): ${GROUP_KEYS.map(g=>GROUPS[g]+" "+Math.round(d.g[g]*100)).join(", ")}. Отстаёт: ${GROUPS[d.lag]}.
Подходов по группам за 30 дней: ${GROUP_KEYS.map(g=>GROUPS[g]+" "+(d.load30[g]||0)).join(", ")}. Тренировок за 30 дней: ${d.last30.length}.
В зале (${gymName()}) есть: ${ALL.filter(e=>!isHidden(e.id)).map(e=>e.n).join(", ")}. Советуй только то, что есть в этом списке, и называй тренажёры так же.
Последние тренировки (вес×повторы; для подтягиваний, брусьев и подъёма ног вес дополнительный):
${recent}
Верни только JSON: {"summary":"1-2 предложения о том, что видно по данным","add":[{"title":"упражнение и схема, напр. Тяга штанги в наклоне 4×8-10","why":"почему, 1 предложение"}],"change":[{"title":"что изменить","why":"почему"}],"next":"план следующей тренировки в одну строку"}. В add 1-2 пункта, в change 1-2 пункта. Не выдумывай данные, которых нет.`;
  coachCtl=new AbortController();
  try{
    const data=await sample.json(prompt,{signal:coachCtl.signal});
    S.coach={state:"done",data:data&&typeof data==="object"?data:{summary:String(data)}};
    announce("Тренер ответил");
  }catch(e){
    const code=e&&e.code;
    if(code==="cancelled") S.coach=null;
    else if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)) S.coach={state:"error",msg:"Доступ к Claude для этой страницы не разрешён. Его можно включить в разрешениях страницы.",retry:false};
    else if(code==="rate_limited") S.coach={state:"error",msg:"Слишком много запросов. Спроси ещё раз через пару минут.",retry:true};
    else S.coach={state:"error",msg:"Тренер не ответил. Спроси ещё раз.",retry:true};
  }
  render();
}

/* ---------- events ---------- */
document.addEventListener("click",async ev=>{
  const t=ev.target.closest("[data-act],[data-tab],[data-add-ex],[data-libg],[data-cg],[data-period],[data-onb-sex],[data-psex]");
  if(!t) return;
  if(t.dataset.act==="close-sheet" && t.classList.contains("sheet-bg") && ev.target.closest("[data-stop]")) return;
  if(t.dataset.tab){S.tab=t.dataset.tab;S.summary=null;S.confirm=null;S.sheet=null;render();window.scrollTo(0,0);return}
  if(t.dataset.onbSex){S.onb=Object.assign(readOnb(),{sex:t.dataset.onbSex});render();return}
  if(t.dataset.psex){Object.assign(S.profile,readProfileInputs(),{sex:t.dataset.psex});store.saveProfile(S.profile);render();return}
  if(t.dataset.period){S.period=t.dataset.period;render();return}
  if(t.dataset.libg){S.sheet.g=t.dataset.libg;render();return}
  if(t.dataset.cg){const v=$("#c-name")?$("#c-name").value:"";S.sheet.cg=t.dataset.cg;render();const n=$("#c-name");if(n)n.value=v;return}
  if(t.dataset.addEx){
    const id=t.dataset.addEx; const last=lastSetsFor(id);
    const sets = last? last.sets.map(s=>({w:s.w,r:""})) : [{w:"",r:""}];
    S.active.exercises.push({ex:id,sets}); S.sheet=null; draft.set(S.active); render();
    const i=S.active.exercises.length-1; const el=document.getElementById("w-"+i+"-0"); if(el) el.scrollIntoView({block:"center"});
    announce(EXM[id].n+": добавлено");
    return;
  }
  const a=t.dataset.act;
  if(!["cancel-yes","del-yes","cancel","del","imp-yes"].includes(a)) S.confirm=null;
  switch(a){
    case "onb-save":{const p=readOnb();const bw=parseFloat(String(p.bw).replace(",","."));
      if(!p.name||!p.name.trim()){showOnbErr("Введи имя персонажа.","o-name");return}
      if(!(bw>25&&bw<300)){showOnbErr("Введи вес тела от 25 до 300 кг, например 78.","o-bw");return}
      S.profile={name:p.name.trim(),sex:p.sex||"m",bw,height:parseInt(p.height)||null,age:parseInt(p.age)||null,gym:"Crunch Fit Lichtenberg",hidden:[],custom:[],createdAt:today()};
      await store.saveProfile(S.profile); S.tab="home"; render(); break}
    case "start": if(S.demo){S.demo=false;S.workouts=[]} S.active={id:uid(),date:today(),t:Date.now(),exercises:[]}; draft.set(S.active); S.tab="workout"; S.sheet={g:"all",q:""}; render(); break;
    case "go-workout": S.tab="workout"; render(); break;
    case "open-lib": S.sheet={g:"all",q:""}; render(); break;
    case "close-sheet": S.sheet=null; render(); break;
    case "add-set":{const ex=S.active.exercises[+t.dataset.i];const last=ex.sets[ex.sets.length-1]||{w:"",r:""};ex.sets.push({w:last.w,r:last.r});draft.set(S.active);render();break}
    case "rm-set":{const ex=S.active.exercises[+t.dataset.i];ex.sets.splice(+t.dataset.j,1);if(!ex.sets.length)S.active.exercises.splice(+t.dataset.i,1);draft.set(S.active);render();break}
    case "rm-ex": S.active.exercises.splice(+t.dataset.i,1); draft.set(S.active); render(); break;
    case "cancel": S.confirm="cancel"; render(); break;
    case "cancel-yes": S.active=null; S.confirm=null; draft.set(null); render(); toast("Запись удалена"); break;
    case "finish":{
      const w=S.active; w.exercises=w.exercises.map(e=>({ex:e.ex,sets:e.sets.filter(s=>parseInt(s.r)>0).map(s=>({w:String(s.w||"0").replace(",","."),r:String(parseInt(s.r)||0)}))})).filter(e=>e.sets.length);
      if(!w.exercises.length){toast("Добавь хотя бы один подход с повторами");return}
      if(S.demo){S.demo=false;S.workouts=[]}
      S.summaryLevelBefore=derive().level;
      S.workouts.push(w); S.active=null; draft.set(null); S.summary=w.id; S.coach=null;
      await store.saveWorkout(w); render(); window.scrollTo(0,0); announce("Тренировка сохранена"); break}
    case "summary-done": S.summary=null; S.tab="home"; render(); window.scrollTo(0,0); break;
    case "del": S.confirm="del:"+t.dataset.id; render(); break;
    case "del-yes":{const id=t.dataset.id;S.workouts=S.workouts.filter(w=>w.id!==id);S.confirm=null;await store.delWorkout(id);render();toast("Тренировка удалена");break}
    case "p-save":{const v=readProfileInputs();
      if(!v.name){toast("Введи имя персонажа");$("#p-name").focus();return}
      if(!(v.bw>25&&v.bw<300)){toast("Введи вес тела от 25 до 300 кг");$("#p-bw").focus();return}
      Object.assign(S.profile,v); await store.saveProfile(S.profile); render(); toast("Профиль сохранён"); break}
    case "demo": S.demo=true; S.workouts=makeDemo(); S.tab="home"; render(); window.scrollTo(0,0); break;
    case "demo-clear": S.demo=false; S.workouts=[]; S.coach=null; render(); break;
    case "exp": downloadBackup(); break;
    case "imp-open": $("#imp-file").click(); break;
    case "imp-yes": if(S.pendingImport) await applyImport(S.pendingImport); break;
    case "imp-no": S.pendingImport=null; render(); break;
    case "coach": askCoach(); break;
    case "coach-reset": S.coach=null; askCoach(); break;
    case "coach-stop": if(coachCtl) coachCtl.abort(); break;
    case "open-gym": S.sheet={mode:"gym",cg:"chest"}; render(); break;
    case "add-custom":{const n=($("#c-name").value||"").trim(); if(!n){toast("Введи название тренажёра");$("#c-name").focus();return}
      S.profile.custom=(S.profile.custom||[]).concat([{id:"c-"+uid(),n,g:S.sheet.cg||"chest"}]); await store.saveProfile(S.profile); render(); toast(n+": добавлен"); break}
    case "rm-custom":{ev.preventDefault();const id=t.dataset.id;S.profile.custom=(S.profile.custom||[]).filter(c=>c.id!==id);await store.saveProfile(S.profile);render();break}
  }
});
document.addEventListener("change",async ev=>{
  const el=ev.target;
  if(el.id==="imp-file"){await readImportFile(el);return}
  if(!el.dataset||!el.dataset.toggleEx) return;
  const id=el.dataset.toggleEx, h=new Set(S.profile.hidden||[]); el.checked?h.delete(id):h.add(id);
  S.profile.hidden=[...h]; await store.saveProfile(S.profile);
  const m=document.querySelector("#gym-h + .meta"); if(m) m.textContent=gymName()+" · "+ALL.filter(e=>!isHidden(e.id)).length+" из "+ALL.length+" тренажёров и упражнений";
});
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape"&&S.sheet){S.sheet=null;render()} });
function readOnb(){const g=id=>{const el=document.getElementById(id);return el?el.value:""};return Object.assign({},S.onb||{},{name:g("o-name"),bw:g("o-bw"),height:g("o-h"),age:g("o-age")})}
function readProfileInputs(){const g=id=>{const el=document.getElementById(id);return el?el.value:""};
  const bw=parseFloat(String(g("p-bw")).replace(",","."));
  return {name:g("p-name").trim(),bw:isNaN(bw)?S.profile.bw:bw,height:parseInt(g("p-h"))||null,age:parseInt(g("p-age"))||null,gym:g("p-gym").trim()||gymName()}}
function showOnbErr(msg,id){const e=$("#o-err");e.textContent=msg;const el=document.getElementById(id);if(el){el.setAttribute("aria-invalid","true");el.focus()}}
document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.dataset&&el.dataset.set&&S.active){
    const [i,j,k]=el.dataset.set.split(".");const s=S.active.exercises[+i].sets[+j];s[k]=el.value.replace(",",".");draft.set(S.active);
    const n=S.active.exercises.reduce((a,e)=>a+e.sets.filter(x=>+x.r>0).length,0);
    const xpEl=document.getElementById("xp-now"); if(xpEl) xpEl.textContent="+"+(n*XP.set)+" XP";
    const fin=document.querySelector('[data-act="finish"]'); if(fin) fin.disabled=!n;
    const ex=S.active.exercises[+i], prev=D.best[ex.ex], lab=document.getElementById("n-"+i+"-"+j);
    if(lab){const isPR=prev!=null&&+s.r>0&&e1rm(loadW(ex.ex,s,D.bw),+s.r)>prev+0.01;const was=lab.classList.contains("pr");lab.textContent=isPR?"PR":(+j+1);lab.classList.toggle("pr",isPR); if(isPR&&!was) announce("Рекорд: "+EXM[ex.ex].n)}
  }
  if(el.id==="lib-q"){S.sheet.q=el.value;const q=el.value.toLowerCase();document.querySelectorAll("[data-add-ex]").forEach(b=>{b.hidden=!!q&&!b.dataset.name.includes(q)});document.querySelectorAll("[data-zone]").forEach(z=>{z.hidden=![...z.querySelectorAll("[data-add-ex]")].some(b=>!b.hidden)})}
});

window.ironLevelBackup={makeBackup,parseBackup};

/* ---------- boot ---------- */
(async function boot(){
  await store.init();
  const data=await store.load();
  S.profile=data.profile; S.workouts=data.workouts||[];
  const dr=draft.get(); if(dr&&dr.exercises) S.active=dr;
  render();
})();
})();
</script>
